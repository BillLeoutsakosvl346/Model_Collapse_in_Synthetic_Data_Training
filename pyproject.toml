[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iib-model-collapse"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.1.2", "transformers==4.37.2", "datasets==3.4.1",
  "huggingface-hub==0.34.4", "matplotlib==3.9.4", "PyYAML==6.0.3",
  "paramiko==3.5.1", "python-dotenv==1.0.1",
  "pandas==2.2.3", "pyarrow==19.0.1",
  "hf-xet==1.7.0",
  "filelock==3.20.0", "requests==2.34.2", "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["model_collapse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
